<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dicema en las IAs</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--muted:#6b6b66;--line:#e4e3de;--accent:#b4232a}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--ink:#ecebe6;--muted:#a3a29b;--line:#34332f;--accent:#e0575e}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(340px,calc(100vw - 32px))}
h1{font-size:20px;margin:0 0 4px}h1 span{color:var(--accent)}p{color:var(--muted);margin:0 0 18px}
input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
.err{color:var(--accent);font-size:13px;margin-top:10px;display:none}
</style></head><body>
<form method="post" action="/login">
<h1><span>Dicema</span> en las IAs</h1><p>Panel privado de visibilidad en buscadores con IA.</p>
<input type="password" name="clave" placeholder="Contraseña" autocomplete="current-password" autofocus required>
<button type="submit">Entrar</button>
<div class="err" id="err">Contraseña incorrecta.</div>
</form>
<script>if(location.search.includes('error'))document.getElementById('err').style.display='block'</script>
</body></html>
